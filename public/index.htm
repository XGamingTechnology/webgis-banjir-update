<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Genangan Banjir – Kabupaten Bandung</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- MapLibre GL JS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.0.1/dist/maplibre-gl.css" />

    <style>
      body {
        padding-top: 56px;
      }
      #map {
        height: calc(100vh - 56px);
        width: 100%;
      }
      .sidebar {
        width: 280px;
        position: fixed;
        top: 56px;
        left: 0;
        bottom: 0;
        background: #f8f9fa;
        border-right: 1px solid #dee2e6;
        overflow-y: auto;
      }
      .main-content {
        margin-left: 280px;
      }
    </style>
  </head>
  <body>
    <!-- Header (sesuai gaya BootstrapMade) -->
    <nav class="navbar navbar-dark bg-primary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <span class="d-none d-sm-block">Kabupaten Bandung</span>
        </a>
      </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="p-3">
        <h6 class="text-muted">FILTER DATA</h6>
        <div class="mb-2">
          <label class="form-label">Tahun</label>
          <select class="form-select form-select-sm" id="filter-tahun">
            <option value="">Semua Tahun</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Kecamatan</label>
          <select class="form-select form-select-sm" id="filter-kecamatan">
            <option value="">Semua Kecamatan</option>
            <option value="Soreang">Soreang</option>
            <option value="Margaasih">Margaasih</option>
            <option value="Katapang">Katapang</option>
            <option value="Dayeuhkolot">Dayeuhkolot</option>
            <option value="Ciparay">Ciparay</option>
          </select>
        </div>

        <h6 class="text-muted mt-3">LAYER</h6>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="layer-points" checked />
          <label class="form-check-label">Titik Genangan</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="layer-heatmap" />
          <label class="form-check-label">Heatmap</label>
        </div>
      </div>
    </div>

    <!-- Peta -->
    <div class="main-content">
      <div id="map"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/main.js"></script>
  </body>
</html>
